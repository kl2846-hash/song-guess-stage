function state(){let s=songs[idx];return {title:s?.title||'',artist:s?.artist||'',start:s?.start||0,clock:$('clock').textContent,number:$('number').textContent,msg:$('msg').textContent,teams,points}}
window.pairPhone=async()=>{if(busy||room)return;busy=true;$('pairStatus').textContent='正在連接 Firebase…';try{await login();let id=Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');let base=ref(db,'rooms/'+id);await onDisconnect(base).remove();await set(base,{state:state()});room=id;let u=new URL(location.href);u.searchParams.set('remote',id);$('pairLink').href=u.href;$('pairLink').textContent=u.href;$('pairStatus').textContent='雲端房間已建立，請在手機開啟私人網址';onChildAdded(ref(db,'rooms/'+id+'/commands'),async snap=>{let m=snap.val();await remove(snap.ref);if(!m||Date.now()-m.at>30000)return;switch(m.action){case 'play':play();break;case 'stop':stop();break;case 'next':move(1);break;case 'prev':move(-1);break;case 'reveal':reveal();break;case 'start':editStart(m.value);break;case 'score':if(Number.isInteger(m.i)&&m.i>=0&&m.i<points.length&&[1,-1].includes(m.v)){points[m.i]=Math.max(0,points[m.i]+m.v);renderScores()}break}});onValue(ref(db,'.info/connected'),s=>$('pairStatus').textContent=s.val()?'Firebase 已連線，私人房間已建立':'雲端斷線，等待重連')}catch(e){$('pairStatus').textContent='Firebase 錯誤：'+e.message}finally{busy=false}};
setInterval(()=>{if(!room||remoteId)return;let s=state(),k=JSON.stringify(s);if(k!==last){last=k;set(ref(db,'rooms/'+room+'/state'),s).catch(e=>{$('pairStatus').textContent=e.message;last=''})}},400);
if(remoteId){document.body.innerHTML='<main style="min-height:90vh"><h2>V6.1 手機主持人控制台</h2><p id="rs">正在連接雲端…</p><h2 id="rt"></h2><div id="rc" style="font-size:70px"></div><div class="controls"><button data-act="prev">上一題</button><button data-act="play" class="primary">播放</button><button data-act="stop">停止</button><button data-act="next">下一題</button><button data-act="reveal">主持人公布</button></div><label>起始秒數 <input id="rst" type="number" min="0"></label><button id="rsave">儲存秒數</button><div id="rscore" class="scores"></div></main>';let ready=false;const send=m=>{if(!ready)return;push(ref(db,'rooms/'+remoteId+'/commands'),{...m,at:Date.now()}).catch(e=>$('rs').textContent=e.message)};try{if(!/^[a-f0-9]{64}$/.test(remoteId))throw Error('配對網址無效');await login();onValue(ref(db,'rooms/'+remoteId+'/state'),snap=>{let m=snap.val();ready=!!m;if(!m){$('rs').textContent='房間不存在或已關閉，請重新配對';return}$('rt').textContent=m.title+' ／ '+m.artist;$('rc').textContent=m.clock;$('rs').textContent='已連線 · '+m.number+' '+m.msg;if(document.activeElement!==$('rst'))$('rst').value=m.start;let k=JSON.stringify([m.teams,m.points]);if($('rscore').dataset.k!==k){$('rscore').dataset.k=k;$('rscore').replaceChildren();m.teams.forEach((n,i)=>{let d=document.createElement('div');d.textContent=n+' '+m.points[i]+' ';for(let v of [-1,1]){let b=document.createElement('button');b.textContent=v>0?'+1':'−1';b.onclick=()=>send({action:'score',i,v});d.append(b)}$('rscore').append(d)})}},e=>$('rs').textContent=e.message);document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>send({action:b.dataset.act}));$('rsave').onclick=()=>send({action:'start',value:$('rst').value});onValue(ref(db,'.info/connected'),s=>{if(!s.val()){ready=false;$('rs').textContent='雲端連線中…'}else ready=!!$('rt').textContent})}catch(e){$('rs').textContent='Firebase 錯誤：'+e.message}}
</script></html>
